---
name: Super-Linter

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  super-linter:
    name: Super-Linter Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Super-Linter
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          LINTER_RULES_PATH: .

          # Exclude vendor and cache directories
          FILTER_REGEX_EXCLUDE: ".*(vendor|node_modules|public/assets/vendor|\\.cache|\\.kilo|megalinter-reports).*"
          IGNORE_GITIGNORED_FILES: true

          # Explicit config filenames
          CSS_FILE_NAME: stylelint.config.mjs
          MARKDOWN_CONFIG_FILE: .markdownlint.json
          PHP_PHPCS_FILE_NAME: phpcs.xml
          PHP_PHPSTAN_FILE_NAME: phpstan.neon
          PHP_PSALM_FILE_NAME: psalm.xml

          # Language Linters Supported for PowerDNS-Admin-PHP:
          # PHP
          VALIDATE_PHP_BUILTIN: true
          VALIDATE_PHP_PHPCS: true
          VALIDATE_PHP_PHPSTAN: true
          VALIDATE_PHP_PSALM: true

          # JavaScript & CSS & HTML
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_CSS: true
          VALIDATE_HTML: true

          # Markdown, YAML, JSON, XML
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_XML: true

          # Shell / Bash (ShellCheck & shfmt)
          VALIDATE_BASH: true
          VALIDATE_SHELL_SHFMT: true

          # GitHub Actions & Security
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GIT_MERGE_CONFLICT_MARKERS: true
          VALIDATE_ENV: true

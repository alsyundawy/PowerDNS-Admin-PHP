# ==============================================================================
# PowerDNS-Admin-PHP - Production Nginx Virtual Host Configuration
# ==============================================================================
# Architecture: High-Performance LEMP Stack with Isolated PHP-FPM Pool
# Full translation of Apache .htaccess rewrite rules, upload sandboxing & headers.
# ==============================================================================

# Upstream socket auto-detection: targets universal symlink or active version pool
upstream pda_php_fpm {
    server unix:/run/php/php-fpm-pda.sock;
    server unix:/run/php/php8.4-fpm-pda.sock backup;
    server unix:/run/php/php8.3-fpm-pda.sock backup;
    server unix:/run/php/php8.2-fpm-pda.sock backup;
    server unix:/run/php/php8.1-fpm-pda.sock backup;
}

server {
    listen 80;
    listen [::]:80;
    server_name dns-admin.example.com;
    root /var/www/PowerDNS-Admin-PHP/public;
    index index.php;

    # Performance & Encodings
    charset utf-8;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;

    # Request Buffer & Upload Limits (Support large BIND zone exports & imports)
    client_max_body_size 64M;
    client_body_buffer_size 128k;
    client_header_timeout 90;
    client_body_timeout 90;

    # Security Headers (Translation of Apache Header directives)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static Assets Caching (Offline Vendor Bundles & Icons)
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Uploads Sandboxing (Direct Translation of public/uploads/.htaccess)
    # Strictly forbids execution of PHP, Perl, Python, Shell, or CGI scripts in uploads
    location ^~ /uploads/ {
        location ~* \.(php|phtml|php[0-9]|phps|cgi|pl|sh|bash|py|rb|asp|aspx|jsp)$ {
            deny all;
            return 404;
        }
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Primary Application Router (Translation of Apache RewriteEngine / RewriteRule)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM FastCGI Handler (Connected to Isolated PHP-FPM Pool [pda])
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass pda_php_fpm;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";

        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 180s;
        fastcgi_read_timeout 180s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;
    }

    # Deny direct web access to sensitive file extensions (Translation of Apache FilesMatch)
    location ~* \.(sql|md|log|sh|json|lock|neon|xml|bak|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny all hidden files (.git, .env, .htaccess, etc.) except ACME challenge
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}

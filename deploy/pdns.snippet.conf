# Cuplikan PowerDNS Authoritative.
# Docs: https://doc.powerdns.com/authoritative/settings.html
# Jangan membuka API ke internet. Panel memanggil 127.0.0.1 atau IP allow-list.

api=yes
api-key=GANTI-DENGAN-RAHASIA-PANJANG
webserver=yes
webserver-address=127.0.0.1
webserver-port=8081
webserver-allow-from=127.0.0.1,::1

# Sejak 4.6.0 api-key boleh hash dari `pdnsutil hash-password`.
# Panel ini mengirim kunci polos di header X-API-Key, jadi simpan nilai polos
# di pdns.conf atau di backend yang menerima pre-shared key, bukan hash.

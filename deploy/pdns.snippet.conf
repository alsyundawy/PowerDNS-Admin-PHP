# PowerDNS Authoritative Server REST API Configuration Snippet (4.8+).
# Official Documentation: https://doc.powerdns.com/authoritative/settings.html
# Place this configuration in /etc/powerdns/pdns.conf or /etc/powerdns/pdns.d/api.conf

# 1. Enable REST API and Internal Webserver
api=yes
api-key=CHANGE-WITH-UUID-OR-RANDOM-HEX-32
webserver=yes
webserver-address=127.0.0.1
webserver-port=8081
webserver-allow-from=127.0.0.1,::1

# 2. PowerDNS 4.8+ Compatibility Notes:
# - REMOVE 'recursor=' option if present from legacy installations. In PowerDNS 4.8+,
#   the internal recursor proxy parameter was removed. Use a standalone Unbound resolver on Port 5353
#   if your server requires local recursive DNS resolution.
# - REMOVE 'bind-config=' option and /etc/powerdns/pdns.d/bind.conf if
#   using the gmysql backend to avoid 'Fatal error: Trying to set unknown setting'.
#
# 3. How to Generate a Cryptographic API Key:
#   uuidgen
#   - or -
#   openssl rand -hex 16
#   - or -
#   cat /proc/sys/kernel/random/uuid
#
# 4. API Credential Notes:
#   The PowerDNS-Admin-PHP panel sends the pre-shared key via the X-API-Key HTTP header,
#   so ensure the api-key value in pdns.conf matches the API Key in the panel Settings menu.

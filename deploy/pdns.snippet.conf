# Cuplikan Konfigurasi REST API PowerDNS Authoritative Server (4.8+).
# Dokumentasi Resmi: https://doc.powerdns.com/authoritative/settings.html
# Letakkan konfigurasi berikut pada /etc/powerdns/pdns.conf atau /etc/powerdns/pdns.d/api.conf

# 1. Aktifkan REST API dan Webserver Internal
api=yes
api-key=GANTI-DENGAN-UUID-ATAU-RANDOM-HEX-32
webserver=yes
webserver-address=127.0.0.1
webserver-port=8081
webserver-allow-from=127.0.0.1,::1

# 2. Catatan Kompatibilitas PowerDNS 4.8+:
# - HAPUS opsi 'recursor=' jika ada dari sisa instalasi lawas. Pada PowerDNS 4.8+,
#   parameter recursor internal sudah dihapus. Gunakan Unbound mandiri di Port 5353
#   jika server membutuhkan recursive DNS resolver lokal.
# - HAPUS opsi 'bind-config=' dan berkas /etc/powerdns/pdns.d/bind.conf jika
#   menggunakan backend gmysql agar tidak memicu 'Fatal error: Trying to set unknown setting'.
#
# 3. Cara Menghasilkan API Key Kriptografis:
#   uuidgen
#   - atau -
#   openssl rand -hex 16
#   - atau -
#   cat /proc/sys/kernel/random/uuid
#
# 4. Catatan Kredensial API:
#   Panel PowerDNS-Admin-PHP mengirimkan kunci pre-shared polos melalui header X-API-Key,
#   sehingga pastikan nilai api-key di pdns.conf sama dengan API Key di menu Pengaturan panel.
